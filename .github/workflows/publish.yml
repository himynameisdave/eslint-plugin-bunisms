name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Verify release tag
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Publish package
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "eslint-plugin-bunisms@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "eslint-plugin-bunisms@$PACKAGE_VERSION is already published; skipping"
            exit 0
          fi
          npm publish --access public
