name: Release

# Manually triggered npm release: choose a bump and the workflow verifies,
# versions, publishes, pushes, and creates the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a non-main ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main (got '${{ github.ref }}')" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release gates
        run: bun run check

      - name: Bump version, commit, and create bare version tag
        run: |
          VERSION="$(npm version "${{ inputs.version }}" --no-git-tag-version)"
          VERSION="${VERSION#v}"
          node --input-type=module - "$VERSION" <<'NODE'
            import fs from "node:fs";
            const path = "src/index.ts";
            const source = fs.readFileSync(path, "utf8");
            const updated = source.replace(/(meta: \{ name: 'eslint-plugin-bunisms', version: ')[^']+(' \})/, `$1${process.argv[2]}$2`);
            if (updated === source) throw new Error("Could not update plugin metadata version in src/index.ts");
            fs.writeFileSync(path, updated);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/index.ts
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The prepublishOnly check already ran above and built dist/.
      - name: Publish to npm
        id: publish
        run: npm publish --ignore-scripts --access public

      - name: Push release commit and tag
        run: git push --atomic origin main "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --generate-notes

      - name: Explain a partial release
        if: failure() && steps.publish.outcome == 'success'
        run: |
          echo "::error::$VERSION is live on npm but a later step failed. Do not rerun this workflow; recover manually using PUBLISHING.md."
